name: Build FIPS Flux CLI image

on:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 2.9.6)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 2.9.6)'
        required: false
        default: '2.9.6'

permissions:
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 image
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version || github.head_ref || github.ref_name }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-fluxcd
        run: |
          VERSION="${VERSION#release/v}"
          VERSION="${VERSION#release/}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION=$(grep -m1 'VERSION:-' build-fluxcd-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')
          bash build-fluxcd-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-fluxcd:${VERSION}-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push arm64 image
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version || github.head_ref || github.ref_name }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-fluxcd
        run: |
          VERSION="${VERSION#release/v}"
          VERSION="${VERSION#release/}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION=$(grep -m1 'VERSION:-' build-fluxcd-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')
          bash build-fluxcd-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-fluxcd:${VERSION}-arm64

  push-manifest:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version || github.head_ref || github.ref_name }}
        run: |
          VERSION="${VERSION#release/v}"
          VERSION="${VERSION#release/}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION=$(grep -m1 'VERSION:-' build-fluxcd-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')
          docker manifest create \
            ghcr.io/${{ github.repository_owner }}/gl-fips-fluxcd:${VERSION} \
            ghcr.io/${{ github.repository_owner }}/gl-fips-fluxcd:${VERSION}-amd64 \
            ghcr.io/${{ github.repository_owner }}/gl-fips-fluxcd:${VERSION}-arm64
          docker manifest push ghcr.io/${{ github.repository_owner }}/gl-fips-fluxcd:${VERSION}
